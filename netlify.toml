[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# Relay de live roda no Netlify Function (evita 502 do Render free/datacenter).
[[redirects]]
  from = "/api/live/relay"
  to = "/.netlify/functions/live-relay"
  status = 200
  force = true

# Relay do Cobalt roda no Netlify Function (IP diferente do Render).
[[redirects]]
  from = "/api/cobalt/relay"
  to = "/.netlify/functions/cobalt-relay"
  status = 200
  force = true

# Proxy API/media/covers para o backend no Render.
# Defina PROXY_SECRET no Netlify e no Render com o mesmo valor.
[[redirects]]
  from = "/api/*"
  to = "https://kakashicortehub.onrender.com/api/:splat"
  status = 200
  force = true
  signed = "PROXY_SECRET"

[[redirects]]
  from = "/media/*"
  to = "https://kakashicortehub.onrender.com/media/:splat"
  status = 200
  force = true
  signed = "PROXY_SECRET"

[[redirects]]
  from = "/covers/*"
  to = "https://kakashicortehub.onrender.com/covers/:splat"
  status = 200
  force = true
  signed = "PROXY_SECRET"

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
