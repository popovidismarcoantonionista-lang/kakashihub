[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Relay de live roda no Netlify Function (evita 502 do Render free/datacenter).
[[redirects]]
  from = "/api/live/relay"
  to = "/.netlify/functions/live-relay"
  status = 200
  force = true

# Relay do Cobalt roda no Netlify Function (IP diferente do Render).
[[redirects]]
  from = "/api/cobalt/relay"
  to = "/.netlify/functions/cobalt-relay"
  status = 200
  force = true

# Proxy API/media/covers para o backend no Codespaces (ponte enquanto o
# container definitivo não volta). PROXY_SECRET precisa ser o mesmo nos dois.
[[redirects]]
  from = "/api/*"
  to = "https://stunning-spoon-697rxj7w7pv927pr-10000.app.github.dev/api/:splat"
  status = 200
  force = true
  signed = "PROXY_SECRET"

[[redirects]]
  from = "/media/*"
  to = "https://stunning-spoon-697rxj7w7pv927pr-10000.app.github.dev/media/:splat"
  status = 200
  force = true
  signed = "PROXY_SECRET"

[[redirects]]
  from = "/covers/*"
  to = "https://stunning-spoon-697rxj7w7pv927pr-10000.app.github.dev/covers/:splat"
  status = 200
  force = true
  signed = "PROXY_SECRET"

# Temporário: busca de mídia no container antigo para migrar ao Netlify Blobs.
# Remover depois que o acervo estiver no storage novo.
[[redirects]]
  from = "/oldmedia/*"
  to = "https://kakashihub-b283a.containers.snapdeploy.app/media/:splat"
  status = 200
  force = true
  signed = "PROXY_SECRET"

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
