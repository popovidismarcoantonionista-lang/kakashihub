invidious:
  instance_name: "Fuga Studio Invidious"
  domain: "invidious-fuga-studio.onrender.com"
  https_only: true
  external_port: 443
  check_tables: true
  db:
    dbname: /config/invidious.db
  # Cache settings for better performance
  cache:
    size: 1000
    ttl: 3600
  # Enable all features
  enable_stats: true
  enable_feed: true
  enable_trending: true
  enable_user_preferences: true
  # Stream quality settings
  default_quality: "720p"
  # Rate limiting (per IP)
  ratelimit:
    enabled: true
    limit: 100
    window: 60