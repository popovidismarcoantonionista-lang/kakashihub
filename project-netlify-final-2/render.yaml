services:
  - type: web
    name: kakashi-hub
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PYTHON
        value: python3
      - key: YT_POT_ENABLED
        value: "true"
      - key: BGUTIL_POT_URL
        value: http://127.0.0.1:4416
      # A interface estática e as rotas /api são atendidas pelo mesmo Express.
      # Configure um disco persistente se precisar manter arquivos entre deploys.
      # disk:
      #   name: kakashi-data
      #   mountPath: /var/data
      #   sizeGB: 10

