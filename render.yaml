services:
  - type: web
    name: kakashi-hub
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PYTHON
        value: python3
      - key: YT_POT_ENABLED
        value: "true"
      - key: BGUTIL_POT_URL
        value: http://127.0.0.1:4416
      # YouTube Data API v3: confirma status/título/canal da live antes do yt-dlp.
      # Valores com sync:false devem ser preenchidos no painel do Render
      # (o Blueprint não promove novos secrets em serviços já existentes).
      - key: YOUTUBE_API_KEY
        sync: false
      # Proxy residencial para downloads de VOD: o YouTube bloqueia IPs de
      # datacenter com "Sign in to confirm you're not a bot". Formato:
      # http://usuario:senha@host:porta (ou socks5://...). Sem isso, o VOD
      # do YouTube falha no Render. Preencher no painel do Render.
      - key: YTDLP_PROXY
        sync: false
      # Cobalt resolve VOD (vídeos comuns), mas RECUSA lives
      # (error.api.content.video.live). Mantido para downloads normais.
      - key: COBALT_API_URL
        value: https://rue-cobalt.xenon.zone/
      - key: COBALT_API_KEY
        sync: false
      # Resolvedor de LIVE: espelho Invidious que devolve `liveNow` + `hlsUrl`
      # (testado sem chave e sem cookies na live z2hktG1zUbs). O HLS é assinado
      # e expira, então é resolvido a cada janela — nunca use como URL fixa.
      - key: INVIDIOUS_API_URLS
        value: https://yt.chocolatemoo53.com,https://invidious.slipfox.xyz,https://invidious.tiekoetter.com
      - key: YTDLP_API_URL
        sync: false
      - key: YTDLP_API_KEY
        sync: false
      # URL HLS já autorizada, quando disponível (alternativa aos resolvedores).
      - key: FUGA_LIVE_STREAM
        sync: false
      # A interface estática e as rotas /api são atendidas pelo mesmo Express.
      # Configure um disco persistente se precisar manter arquivos entre deploys.
      # disk:
      #   name: kakashi-data
      #   mountPath: /var/data
      #   sizeGB: 10

  # Novo frontend (TanStack Start). Processes independente do Express acima:
  # mesmo repositório, diretório separado e um único processo Node no Render.
  - type: web
    name: kakashii-hub
    runtime: node
    plan: free
    rootDir: kakashii-hub
    buildCommand: npm install --no-audit --no-fund && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production

